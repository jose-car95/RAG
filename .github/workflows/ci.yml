name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run flake8 .

  types:
    name: types (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # Same flags as `make lint` (subject, Common Instructions V.2).
      - run: >-
          uv run mypy . --warn-return-any --warn-unused-ignores
          --ignore-missing-imports --disallow-untyped-defs
          --check-untyped-defs

  tests:
    name: tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest
